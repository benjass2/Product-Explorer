<mat-toolbar class="app-toolbar">
  <div class="toolbar-brand">
    <img [src]="logoUrl" [alt]="'TOOLBAR.TITLE' | translate" class="toolbar-logo" />
    <span class="toolbar-title">{{'TOOLBAR.TITLE' | translate}}</span>
  </div>

  <span class="toolbar-spacer"></span>
  <span class="toolbar-lang-label">{{'TOOLBAR.LANGUAGE' | translate}}</span>
  <mat-button-toggle-group [value]="currentLanguage" (change)="onLanguageChange($event.value)" class="lang-toggle" aria-label="Language selection">
    <mat-button-toggle value="en">EN</mat-button-toggle>
    <mat-button-toggle value="es">ES</mat-button-toggle>
  </mat-button-toggle-group>
</mat-toolbar>
